[project]
name = "powerlifting-reference-points"
version = "0.1.0"
description = "Reference-dependence study of third-attempt selection in powerlifting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "linearmodels>=7.1",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
